name: Schema Bootstrap

on:
  push:
    branches:
      - agent/json-schema-publication

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: agent/json-schema-publication

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project
        run: uv sync --all-extras

      - name: Publish schemas
        run: uv run python -m ludowright.contracts publish

      - name: Commit generated publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemas/v1
          if git diff --cached --quiet; then
            echo "Schema publication is already current."
          else
            git commit -m "Publish JSON Schema v1"
            git push origin HEAD:agent/json-schema-publication
          fi
