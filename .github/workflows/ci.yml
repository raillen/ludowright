name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out CLI branch
        uses: actions/checkout@v7
        with:
          ref: agent/cli-foundation

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project and quality tools
        run: uv sync --extra dev --extra docs

      - name: Apply CLI integration fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          app_path = Path("src/ludowright/cli/app.py")
          app_text = app_path.read_text(encoding="utf-8")
          app_text = app_text.replace("    command_console,\n", "", 1)
          app_path.write_text(app_text, encoding="utf-8")

          runtime_path = Path("src/ludowright/cli/runtime.py")
          runtime_text = runtime_path.read_text(encoding="utf-8")
          runtime_text = runtime_text.replace("from typing import TypeVar\n", "")
          runtime_text = runtime_text.replace(
              "CommandData = dict[str, object]\n"
              "T = TypeVar(\"T\", bound=CommandData)\n"
              "DataFactory = Callable[[], T]\n"
              "HumanRenderer = Callable[[Console, T], None]\n",
              "CommandData = dict[str, object]\n"
              "DataFactory = Callable[[], CommandData]\n"
              "HumanRenderer = Callable[[Console, CommandData], None]\n",
              1,
          )
          runtime_text = runtime_text.replace(
              "    action: DataFactory[T],\n"
              "    render_human: HumanRenderer[T],\n",
              "    action: DataFactory,\n"
              "    render_human: HumanRenderer,\n",
              1,
          )
          runtime_text = runtime_text.replace(
              "    except CliFailure as failure:\n"
              "        emit_failure(command=command, failure=failure, json_output=json_output, context=context)\n"
              "    except Exception as error:\n"
              "        failure = _known_failure(error)\n"
              "        if failure is None:\n"
              "            raise\n"
              "        emit_failure(command=command, failure=failure, json_output=json_output, context=context)\n",
              "    except CliFailure as expected_failure:\n"
              "        emit_failure(\n"
              "            command=command,\n"
              "            failure=expected_failure,\n"
              "            json_output=json_output,\n"
              "            context=context,\n"
              "        )\n"
              "    except Exception as error:\n"
              "        mapped_failure = _known_failure(error)\n"
              "        if mapped_failure is None:\n"
              "            raise\n"
              "        emit_failure(\n"
              "            command=command,\n"
              "            failure=mapped_failure,\n"
              "            json_output=json_output,\n"
              "            context=context,\n"
              "        )\n",
              1,
          )
          runtime_path.write_text(runtime_text, encoding="utf-8")

          test_path = Path("tests/test_cli.py")
          test_text = test_path.read_text(encoding="utf-8")
          test_text = test_text.replace(
              "def test_diagnostics_json_outside_project() -> None:\n"
              "    with runner.isolated_filesystem():\n"
              "        payload, exit_code, _raw = json_response([\"diagnostics\", \"--json\"])\n",
              "def test_diagnostics_json_outside_project(\n"
              "    tmp_path: Path,\n"
              "    monkeypatch: pytest.MonkeyPatch,\n"
              ") -> None:\n"
              "    monkeypatch.chdir(tmp_path)\n"
              "    payload, exit_code, _raw = json_response([\"diagnostics\", \"--json\"])\n",
              1,
          )
          test_text = test_text.replace(
              "def test_diagnostics_discovers_nearest_project() -> None:\n"
              "    with runner.isolated_filesystem():\n"
              "        marker = Path(\".ludowright/project.json\")\n"
              "        marker.parent.mkdir(parents=True)\n"
              "        marker.write_text(\"{}\\n\", encoding=\"utf-8\")\n"
              "        payload, exit_code, _raw = json_response([\"--json\", \"diagnostics\"])\n"
              "        expected_root = Path.cwd().resolve().as_posix()\n",
              "def test_diagnostics_discovers_nearest_project(\n"
              "    tmp_path: Path,\n"
              "    monkeypatch: pytest.MonkeyPatch,\n"
              ") -> None:\n"
              "    monkeypatch.chdir(tmp_path)\n"
              "    marker = Path(\".ludowright/project.json\")\n"
              "    marker.parent.mkdir(parents=True)\n"
              "    marker.write_text(\"{}\\n\", encoding=\"utf-8\")\n"
              "    payload, exit_code, _raw = json_response([\"--json\", \"diagnostics\"])\n"
              "    expected_root = tmp_path.resolve().as_posix()\n",
              1,
          )
          test_text = test_text.replace(
              "def test_diagnostics_human_output_uses_rich_table() -> None:\n"
              "    with runner.isolated_filesystem():\n"
              "        result = runner.invoke(app, [\"diagnostics\"])\n",
              "def test_diagnostics_human_output_uses_rich_table(\n"
              "    tmp_path: Path,\n"
              "    monkeypatch: pytest.MonkeyPatch,\n"
              ") -> None:\n"
              "    monkeypatch.chdir(tmp_path)\n"
              "    result = runner.invoke(app, [\"diagnostics\"])\n",
              1,
          )
          test_path.write_text(test_text, encoding="utf-8")

          schema_docs = Path("docs/contracts/JSON_SCHEMAS.md")
          schema_text = schema_docs.read_text(encoding="utf-8")
          schema_text = schema_text.replace(
              "| Dependency graph | `dependency-graph.schema.json` |\n",
              "| Dependency graph | `dependency-graph.schema.json` |\n"
              "| CLI response | `cli-response.schema.json` |\n",
              1,
          )
          schema_docs.write_text(schema_text, encoding="utf-8")

          atlas_path = Path("docs/ATLAS.md")
          atlas = atlas_path.read_text(encoding="utf-8")
          atlas = atlas.replace(
              "- [`contracts/DEPENDENCY_GRAPH.md`](contracts/DEPENDENCY_GRAPH.md) — typed nodes and edges, observed revisions, freshness states, invalidation paths, refresh rules, and canonical graph persistence.\n",
              "- [`contracts/DEPENDENCY_GRAPH.md`](contracts/DEPENDENCY_GRAPH.md) — typed nodes and edges, observed revisions, freshness states, invalidation paths, refresh rules, and canonical graph persistence.\n"
              "- [`contracts/CLI.md`](contracts/CLI.md) — dual human/JSON surfaces, response envelope, error codes, exit codes, version output, diagnostics, and compatibility rules.\n",
              1,
          )
          atlas = atlas.replace("- CLI JSON output;\n", "", 1)
          atlas = atlas.replace(
              "- [`contracts/DEPENDENCY_GRAPH.md`](contracts/DEPENDENCY_GRAPH.md) — cycle rejection, revision propagation, impact-path selection, refresh blocking, contract round-trip, and repository conflict tests.\n",
              "- [`contracts/DEPENDENCY_GRAPH.md`](contracts/DEPENDENCY_GRAPH.md) — cycle rejection, revision propagation, impact-path selection, refresh blocking, contract round-trip, and repository conflict tests.\n"
              "- [`contracts/CLI.md`](contracts/CLI.md) — envelope invariants, deterministic JSON, global options, diagnostics, quality failures, and exit-code tests.\n",
              1,
          )
          atlas = atlas.replace("- CLI contract testing;\n", "", 1)
          atlas = atlas.replace(
              "- [`contracts/DEPENDENCY_GRAPH.md`](contracts/DEPENDENCY_GRAPH.md) — bounded graph documents, typed identities, cycle rejection, deterministic causes, and optimistic write conflicts.\n",
              "- [`contracts/DEPENDENCY_GRAPH.md`](contracts/DEPENDENCY_GRAPH.md) — bounded graph documents, typed identities, cycle rejection, deterministic causes, and optimistic write conflicts.\n"
              "- [`contracts/CLI.md`](contracts/CLI.md) — bounded machine output, expected-error mapping, read-only diagnostics, no-color policy, and traceback boundaries.\n",
              1,
          )
          atlas = atlas.replace(
              "## Decisions\n\n",
              "## Decisions\n\n"
              "- [`decisions/0014-stable-dual-surface-cli-contract.md`](decisions/0014-stable-dual-surface-cli-contract.md) — accepted Rich human output, one canonical JSON envelope, stable semantic errors and process codes, version output, and read-only diagnostics.\n",
              1,
          )
          atlas_path.write_text(atlas, encoding="utf-8")
          PY
          uv run ruff format src tests
          uv run ruff check --fix src tests
          uv run ruff format src tests
          uv run python -m ludowright.contracts publish

      - name: Validate complete CLI foundation
        run: uv run ludowright quality check

      - name: Commit validated CLI integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs schemas
          if git diff --cached --quiet; then
            echo "No CLI integration changes to commit."
          else
            git commit -m "Finalize CLI response publication"
            git push origin HEAD:agent/cli-foundation
          fi
