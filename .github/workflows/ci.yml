name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v7
        with:
          ref: agent/migration-framework

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project and quality tools
        run: uv sync --extra dev --extra docs

      - name: Integrate state schema v2 and migration publication
        run: |
          python - <<'PY'
          from pathlib import Path

          # StateStore v2 and migration history.
          path = Path("src/ludowright/infrastructure/state_store.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("_STATE_SCHEMA_VERSION = 1", "STATE_SCHEMA_VERSION = 2", 1)
          text = text.replace("_STATE_SCHEMA_VERSION", "STATE_SCHEMA_VERSION")
          text = text.replace(
              '        expected = {"event_checkpoint", "indexed_entity", "workflow_progress"}\n',
              '        expected = {\n'
              '            "event_checkpoint",\n'
              '            "indexed_entity",\n'
              '            "migration_history",\n'
              '            "workflow_progress",\n'
              '        }\n',
              1,
          )
          marker = '\n)\n\n\ndef _workflow_from_row'
          migration_table = '''
              """
              CREATE TABLE migration_history (
                  migration_id TEXT PRIMARY KEY,
                  run_id TEXT NOT NULL,
                  source_version INTEGER NOT NULL CHECK(source_version >= 1),
                  target_version INTEGER NOT NULL CHECK(target_version = source_version + 1),
                  applied_at TEXT NOT NULL,
                  tool_version TEXT NOT NULL
              ) STRICT, WITHOUT ROWID
              """,
          )
          migration_table = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in migration_table.splitlines()
          )
          if marker not in text:
              raise SystemExit("state schema tuple marker not found")
          text = text.replace(marker, f"{migration_table}{marker}", 1)
          path.write_text(text, encoding="utf-8")

          # Public state schema constant.
          path = Path("src/ludowright/infrastructure/__init__.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "    DEFAULT_STATE_STORE_PATH,\n",
              "    DEFAULT_STATE_STORE_PATH,\n    STATE_SCHEMA_VERSION,\n",
              1,
          )
          text = text.replace(
              '    "STATE_MIGRATIONS",\n',
              '    "STATE_MIGRATIONS",\n    "STATE_SCHEMA_VERSION",\n',
              1,
          )
          path.write_text(text, encoding="utf-8")

          # Migration engine connection lifetime and target source of truth.
          path = Path("src/ludowright/infrastructure/migrations.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from collections.abc import Callable\n",
              "from collections.abc import Callable, Iterator\n",
              1,
          )
          text = text.replace(
              "from dataclasses import dataclass\n",
              "from contextlib import contextmanager\nfrom dataclasses import dataclass\n",
              1,
          )
          text = text.replace("import tempfile\n", "")
          text = text.replace(
              "from ludowright.infrastructure.state_store import DEFAULT_STATE_STORE_PATH\n",
              "from ludowright.infrastructure.state_store import (\n"
              "    DEFAULT_STATE_STORE_PATH,\n"
              "    STATE_SCHEMA_VERSION,\n"
              ")\n",
              1,
          )
          text = text.replace(
              "TARGET_STATE_SCHEMA_VERSION = 2",
              "TARGET_STATE_SCHEMA_VERSION = STATE_SCHEMA_VERSION",
              1,
          )
          old_connect = '''    def _connect(self, database: Path, *, readonly: bool) -> sqlite3.Connection:
              if readonly:
                  uri = f"file:{database.as_posix()}?mode=ro"
                  connection = sqlite3.connect(
                      uri,
                      uri=True,
                      timeout=self._busy_timeout_ms / 1000,
                      isolation_level=None,
                  )
              else:
                  connection = sqlite3.connect(
                      database,
                      timeout=self._busy_timeout_ms / 1000,
                      isolation_level=None,
                  )
              connection.execute(f"PRAGMA busy_timeout = {self._busy_timeout_ms}")
              connection.execute("PRAGMA foreign_keys = ON")
              connection.execute("PRAGMA trusted_schema = OFF")
              if not readonly:
                  connection.execute("PRAGMA synchronous = FULL")
              return connection
          '''
          old_connect = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in old_connect.splitlines()
          ) + "\n"
          new_connect = '''    @contextmanager
              def _connect(
                  self,
                  database: Path,
                  *,
                  readonly: bool,
              ) -> Iterator[sqlite3.Connection]:
                  if readonly:
                      uri = f"{database.resolve().as_uri()}?mode=ro"
                      connection = sqlite3.connect(
                          uri,
                          uri=True,
                          timeout=self._busy_timeout_ms / 1000,
                          isolation_level=None,
                      )
                  else:
                      connection = sqlite3.connect(
                          database,
                          timeout=self._busy_timeout_ms / 1000,
                          isolation_level=None,
                      )
                  try:
                      connection.execute(f"PRAGMA busy_timeout = {self._busy_timeout_ms}")
                      connection.execute("PRAGMA foreign_keys = ON")
                      connection.execute("PRAGMA trusted_schema = OFF")
                      if not readonly:
                          connection.execute("PRAGMA synchronous = FULL")
                      yield connection
                  finally:
                      connection.close()
          '''
          new_connect = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in new_connect.splitlines()
          ) + "\n"
          if old_connect not in text:
              raise SystemExit("migration connection block not found")
          text = text.replace(old_connect, new_connect, 1)
          path.write_text(text, encoding="utf-8")

          # Existing state-store expectations now target v2.
          path = Path("tests/test_state_store.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("assert state.schema_version == 1", "assert state.schema_version == 2", 1)
          text = text.replace(
              'assert connection.execute("PRAGMA user_version").fetchone()[0] == 1',
              'assert connection.execute("PRAGMA user_version").fetchone()[0] == 2',
              1,
          )
          text = text.replace(
              '            "indexed_entity",\n            "workflow_progress",\n',
              '            "indexed_entity",\n'
              '            "migration_history",\n'
              '            "workflow_progress",\n',
              1,
          )
          path.write_text(text, encoding="utf-8")

          # Migration tests use explicit UTC values and precise safety errors.
          path = Path("tests/test_migrations.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from concurrent.futures import ThreadPoolExecutor\nfrom pathlib import Path\n",
              "from concurrent.futures import ThreadPoolExecutor\n"
              "from datetime import UTC, datetime\n"
              "from pathlib import Path\n",
              1,
          )
          text = text.replace(
              "    UnsupportedStateSchemaError,\n",
              "    UnsupportedStateSchemaError,\n    UnsafeProjectPathError,\n",
              1,
          )
          text = text.replace(
              '    with pytest.raises(Exception, match="symlink"):\n',
              '    with pytest.raises(UnsafeProjectPathError, match="symlink"):\n',
              1,
          )
          old_helper = '''def datetime_from_text(value: str):
              from datetime import datetime

              return datetime.strptime(value, "%Y-%m-%dT%H:%M:%S.%fZ").replace(
                  tzinfo=__import__("datetime").UTC
              )
          '''
          old_helper = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in old_helper.splitlines()
          ) + "\n"
          new_helper = '''def datetime_from_text(value: str) -> datetime:
              return datetime.strptime(value, "%Y-%m-%dT%H:%M:%S.%fZ").replace(tzinfo=UTC)
          '''
          new_helper = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in new_helper.splitlines()
          ) + "\n"
          if old_helper not in text:
              raise SystemExit("migration test datetime helper not found")
          text = text.replace(old_helper, new_helper, 1)
          path.write_text(text, encoding="utf-8")

          # State-store documentation now describes v2 and explicit v1 migration.
          path = Path("docs/contracts/STATE_STORE.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "The initial database uses:\n\n```text\nPRAGMA user_version = 1\n```",
              "The current database uses:\n\n```text\n"
              "PRAGMA user_version = 2\n```\n\n"
              "Fresh databases are created at v2. Existing v1 databases require the "
              "explicit migration framework documented in "
              "[`MIGRATIONS.md`](MIGRATIONS.md).",
              1,
          )
          text = text.replace(
              "A new empty database is initialized as version 1. A database with another non-zero version is rejected with `UnsupportedStateSchemaError`.",
              "A new empty database is initialized as version 2. A v1 database is rejected until the explicit v1→v2 migration is applied. Other non-zero versions are rejected with `UnsupportedStateSchemaError`.",
              1,
          )
          text = text.replace(
              "### `event_checkpoint`\n",
              "### `migration_history`\n\n"
              "Stores one immutable row per applied state-schema migration:\n\n"
              "- migration ID;\n"
              "- run ID;\n"
              "- source and target versions;\n"
              "- canonical UTC timestamp;\n"
              "- LudoWright tool version.\n\n"
              "The external rollback receipt remains authoritative for backup restoration because rolling back to v1 removes this v2-only table.\n\n"
              "### `event_checkpoint`\n",
              1,
          )
          text = text.replace(
              "Schema migration is deliberately deferred to the next implementation PR. The state store must not guess how to upgrade an unknown version.",
              "Schema migration is explicit and backed up. The state store must not guess how to upgrade an unknown version.",
              1,
          )
          text = text.replace(
              "- schema migrations;\n",
              "- canonical-file migrations;\n",
              1,
          )
          path.write_text(text, encoding="utf-8")

          # JSON Schema documentation lists the new contract.
          path = Path("docs/contracts/JSON_SCHEMAS.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "| `capture-profile` | `capture-profile.schema.json` | Reusable visual-production and technical-sheet requirements |\n",
              "| `capture-profile` | `capture-profile.schema.json` | Reusable visual-production and technical-sheet requirements |\n"
              "| `migration-receipt` | `migration-receipt.schema.json` | Migration backup, execution, failure, and rollback metadata |\n",
              1,
          )
          path.write_text(text, encoding="utf-8")

          # Documentation navigation and atlas.
          path = Path("mkdocs.yml")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "      - SQLite State Store: contracts/STATE_STORE.md\n",
              "      - SQLite State Store: contracts/STATE_STORE.md\n"
              "      - Migrations: contracts/MIGRATIONS.md\n",
              1,
          )
          text = text.replace(
              "      - ADR 0011 — Rebuildable SQLite State Index: decisions/0011-rebuildable-sqlite-state-index.md\n",
              "      - ADR 0011 — Rebuildable SQLite State Index: decisions/0011-rebuildable-sqlite-state-index.md\n"
              "      - ADR 0012 — Explicit Backed-Up Migrations: decisions/0012-explicit-backed-up-schema-migrations.md\n",
              1,
          )
          path.write_text(text, encoding="utf-8")

          path = Path("docs/ATLAS.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "- [`contracts/STATE_STORE.md`](contracts/STATE_STORE.md) — rebuildable SQLite workflow state, entity indexes, event checkpoints, transactions, and canonical-source consistency.\n",
              "- [`contracts/STATE_STORE.md`](contracts/STATE_STORE.md) — rebuildable SQLite workflow state, entity indexes, event checkpoints, transactions, and canonical-source consistency.\n"
              "- [`contracts/MIGRATIONS.md`](contracts/MIGRATIONS.md) — contiguous plans, dry runs, consistent backups, receipts, transactional apply, and guarded rollback.\n",
              1,
          )
          text = text.replace(
              "- [`contracts/STATE_STORE.md`](contracts/STATE_STORE.md) — WAL, strict tables, rollback, concurrency, checkpoint, source-digest, corruption, and rebuild tests.\n",
              "- [`contracts/STATE_STORE.md`](contracts/STATE_STORE.md) — WAL, strict tables, rollback, concurrency, checkpoint, source-digest, corruption, and rebuild tests.\n"
              "- [`contracts/MIGRATIONS.md`](contracts/MIGRATIONS.md) — catalog, dry-run, backup, failure rollback, explicit restore, tampering, and concurrency tests.\n",
              1,
          )
          text = text.replace(
              "- [`contracts/STATE_STORE.md`](contracts/STATE_STORE.md) — SQLite sidecar safety, parameterized operations, strict schemas, short transactions, and corruption isolation.\n",
              "- [`contracts/STATE_STORE.md`](contracts/STATE_STORE.md) — SQLite sidecar safety, parameterized operations, strict schemas, short transactions, and corruption isolation.\n"
              "- [`contracts/MIGRATIONS.md`](contracts/MIGRATIONS.md) — trusted migration code, durable backups, strict receipts, digest-guarded rollback, and fail-closed versions.\n",
              1,
          )
          text = text.replace(
              "## Decisions\n\n",
              "## Decisions\n\n"
              "- [`decisions/0012-explicit-backed-up-schema-migrations.md`](decisions/0012-explicit-backed-up-schema-migrations.md) — accepted explicit contiguous migration plans, dry runs, durable SQLite backups, strict receipts, transactional apply, and guarded rollback.\n",
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY

          uv run ruff format src tests
          uv run ruff check --fix src tests
          uv run ruff format src tests
          uv run python -m ludowright.contracts publish

      - name: Validate complete migration framework
        run: uv run ludowright quality check

      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs mkdocs.yml schemas
          if git diff --cached --quiet; then
            echo "No migration integration changes to commit."
          else
            git commit -m "Integrate state schema v2 migrations"
            git push origin HEAD:agent/migration-framework
          fi
