name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v7
        with:
          ref: agent/migration-framework

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project and quality tools
        run: uv sync --extra dev --extra docs

      - name: Apply migration safety fixes
        run: |
          uv run python scripts/fix_migration_safety.py
          python - <<'PY'
          from pathlib import Path

          path = Path("src/ludowright/infrastructure/migrations.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "        with self._filesystem.lock(_MIGRATION_LOCK, timeout=timeout):\n"
              "            with self._filesystem.lock(STATE_STORE_WRITE_LOCK, timeout=timeout):\n"
              "                return self._apply_locked(target_version=target_version)\n",
              "        with (\n"
              "            self._filesystem.lock(_MIGRATION_LOCK, timeout=timeout),\n"
              "            self._filesystem.lock(STATE_STORE_WRITE_LOCK, timeout=timeout),\n"
              "        ):\n"
              "            return self._apply_locked(target_version=target_version)\n",
              1,
          )
          text = text.replace(
              "        with self._filesystem.lock(_MIGRATION_LOCK, timeout=timeout):\n"
              "            with self._filesystem.lock(STATE_STORE_WRITE_LOCK, timeout=timeout):\n"
              "                return self._rollback_locked(run_id)\n",
              "        with (\n"
              "            self._filesystem.lock(_MIGRATION_LOCK, timeout=timeout),\n"
              "            self._filesystem.lock(STATE_STORE_WRITE_LOCK, timeout=timeout),\n"
              "        ):\n"
              "            return self._rollback_locked(run_id)\n",
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
          rm scripts/fix_migration_safety.py
          uv run ruff format src tests
          uv run ruff check --fix src tests
          uv run ruff format src tests
          uv run python -m ludowright.contracts publish

      - name: Validate complete migration framework
        run: uv run ludowright quality check

      - name: Commit validated safety fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs schemas
          if git diff --cached --quiet; then
            echo "No migration safety changes to commit."
          else
            git commit -m "Harden migration backup and recovery boundaries"
            git push origin HEAD:agent/migration-framework
          fi
