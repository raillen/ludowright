name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/structured-repositories

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project and quality tools
        run: uv sync --extra dev --extra docs

      - name: Apply fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/ludowright/infrastructure/filesystem.py")
          text = path.read_text(encoding="utf-8")
          constants = (
              'PROJECT_MARKER = RepositoryPath(".ludowright/project.json")\n'
              'LOCK_DIRECTORY = RepositoryPath(".ludowright/locks")\n\n\n'
          )
          text = text.replace(constants, "", 1)
          anchor = "\n\n@dataclass(frozen=True, slots=True)\nclass LockMetadata:"
          replacement = f"\n\n{constants}@dataclass(frozen=True, slots=True)\nclass LockMetadata:"
          if anchor not in text:
              raise SystemExit("LockMetadata insertion anchor not found")
          text = text.replace(anchor, replacement, 1)
          path.write_text(text, encoding="utf-8")

          path = Path("tests/test_filesystem.py")
          text = path.read_text(encoding="utf-8")
          if "import string\n" not in text:
              text = text.replace("import os\n", "import os\nimport string\n", 1)
          text = text.replace(
              '_SAFE_SEGMENT_ALPHABET = "abcdefghijklmnopqrstuvwxyz0123456789-_"',
              '_SAFE_SEGMENT_ALPHABET = string.ascii_lowercase + string.digits + "-_"',
          )
          path.write_text(text, encoding="utf-8")

          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          if '"types-pyyaml>=6.0.12,<7"' not in text:
              text = text.replace(
                  '  "ruff>=0.12,<1",\n',
                  '  "ruff>=0.12,<1",\n  "types-pyyaml>=6.0.12,<7",\n',
                  1,
              )
          path.write_text(text, encoding="utf-8")

          path = Path("src/ludowright/infrastructure/structured.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("from typing import Any, Generic, TypeVar", "from typing import Any, cast")
          text = text.replace('\nTContract = TypeVar("TContract", bound=ContractModel)\n', "\n")
          text = text.replace(
              "class StructuredDocumentSnapshot(Generic[TContract]):",
              "class StructuredDocumentSnapshot[TContract: ContractModel]:",
          )
          text = text.replace(
              "class StructuredDocumentRepository(Generic[TContract]):",
              "class StructuredDocumentRepository[TContract: ContractModel]:",
          )
          text = text.replace(
              "class JsonDocumentRepository(StructuredDocumentRepository[TContract]):",
              "class JsonDocumentRepository[TContract: ContractModel](StructuredDocumentRepository[TContract]):",
          )
          text = text.replace(
              "class YamlDocumentRepository(StructuredDocumentRepository[TContract]):",
              "class YamlDocumentRepository[TContract: ContractModel](StructuredDocumentRepository[TContract]):",
          )
          text = text.replace(
              "        text = yaml.dump(\n",
              "        text = cast(\n            str,\n            yaml.dump(\n",
              1,
          )
          text = text.replace(
              "            width=100,\n        )\n        if not text.endswith",
              "                width=100,\n            ),\n        )\n        if not text.endswith",
              1,
          )
          text = text.replace('.encode("utf-8")', ".encode()")
          path.write_text(text, encoding="utf-8")

          path = Path("tests/test_structured_repositories.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '@pytest.mark.parametrize(\n    (path, repository_type),',
              '@pytest.mark.parametrize(\n    "path,repository_type",',
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY

          uv run ruff format src tests
          uv run ruff check --fix src tests
          uv run ruff format src tests

      - name: Refresh dependencies after pyproject changes
        run: uv sync --extra dev --extra docs

      - name: Validate fixes
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run mypy src
          uv run pytest tests/test_filesystem.py tests/test_structured_repositories.py -q

      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src tests
          if git diff --cached --quiet; then
            echo "No fixes to commit."
          else
            git commit -m "Fix structured repository quality gates"
            git push origin HEAD:agent/structured-repositories
          fi