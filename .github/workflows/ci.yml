name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v7
        with:
          ref: agent/migration-framework

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project and quality tools
        run: uv sync --extra dev --extra docs

      - name: Integrate StateStore v2 and migration publication
        run: |
          uv run python scripts/integrate_migration_v2.py
          rm scripts/integrate_migration_v2.py
          uv run ruff format src tests
          uv run ruff check --fix src tests
          uv run ruff format src tests
          uv run python -m ludowright.contracts publish

      - name: Validate complete migration framework
        run: uv run ludowright quality check

      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs mkdocs.yml schemas
          if git diff --cached --quiet; then
            echo "No migration integration changes to commit."
          else
            git commit -m "Integrate state schema v2 migrations"
            git push origin HEAD:agent/migration-framework
          fi
