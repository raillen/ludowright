name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out event-log branch
        uses: actions/checkout@v7
        with:
          ref: agent/event-log

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project and quality tools
        run: uv sync --extra dev --extra docs

      - name: Apply event-log fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/ludowright/domain/events.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "type FrozenJsonScalar = None | bool | int | float | str",
              "type FrozenJsonScalar = bool | int | float | str | None",
              1,
          )
          path.write_text(text, encoding="utf-8")

          path = Path("tests/test_event_log.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace('match=".jsonl"', 'match=r"\\.jsonl"', 1)
          text = text.replace(
              "max_log_bytes=700, max_line_bytes=600",
              "max_log_bytes=900, max_line_bytes=900",
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY

          uv run ruff format src tests
          uv run ruff check --fix src tests
          uv run ruff format src tests

      - name: Validate event-log changes
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
          uv run mypy src
          uv run pytest --no-cov tests/test_event_log.py -q

      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if git diff --cached --quiet; then
            echo "No fixes to commit."
          else
            git commit -m "Fix event-log quality gates"
            git push origin HEAD:agent/event-log
          fi