name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out SQLite branch
        uses: actions/checkout@v7
        with:
          ref: agent/sqlite-state-store

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project and quality tools
        run: uv sync --extra dev --extra docs

      - name: Apply formatter and lint fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_state_store.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace('match=".sqlite3"', 'match=r"\\.sqlite3"', 1)
          path.write_text(text, encoding="utf-8")
          PY

          uv run ruff check --fix src tests
          uv run ruff format src tests

      - name: Validate full quality gate
        run: uv run ludowright quality check

      - name: Commit validated fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          if git diff --cached --quiet; then
            echo "No fixes to commit."
          else
            git commit -m "Format SQLite state-store implementation"
            git push origin HEAD:agent/sqlite-state-store
          fi
