[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ludowright"
version = "0.1.0.dev0"
description = "A Codex-native framework for structured game production."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
  { name = "Raillen Santos" },
]
keywords = [
  "codex",
  "game-development",
  "game-design",
  "documentation",
  "asset-pipeline",
  "image-generation",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "jinja2>=3.1,<4",
  "odfpy>=1.4.1,<2",
  "pillow>=11,<13",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0.2,<7",
  "rich>=14,<16",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "detect-secrets>=1.5,<2",
  "hypothesis>=6,<7",
  "mypy>=2.3,<3",
  "pip-audit>=2,<3",
  "pre-commit>=4,<5",
  "pytest>=9.1,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.12,<1",
  "types-pyyaml>=6.0.12,<7",
]
docs = [
  "mkdocs>=1.6.1,<2",
  "mkdocs-material>=9.7,<10",
]

[project.scripts]
ludowright = "ludowright.cli.app:main"

[project.urls]
Homepage = "https://github.com/raillen/ludowright"
Documentation = "https://raillen.github.io/ludowright/"
Repository = "https://github.com/raillen/ludowright"
Issues = "https://github.com/raillen/ludowright/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ludowright", "integrations"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=ludowright --cov-report=term-missing"
markers = [
  "clean_installation: validate published distributions in isolated environments",
  "end_to_end: validate the complete local-first project workflow",
  "external_beta: validate a user-authorized external project slice",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ludowright"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["ludowright"]
