site_name: LudoWright
site_description: A Codex-native framework for structured game production.
site_url: https://raillen.github.io/ludowright/
repo_url: https://github.com/raillen/ludowright
repo_name: raillen/ludowright
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

nav:
  - Home: index.md
  - Documentation Atlas: ATLAS.md
  - Product:
      - Product Vision: product/PRODUCT_VISION.md
      - Product Document Set: product/PRODUCT_DOCUMENT_SET.md
      - Roadmap: product/ROADMAP.md
  - Architecture:
      - System Overview: architecture/SYSTEM_OVERVIEW.md
      - Architecture Document Set: architecture/ARCHITECTURE_DOCUMENT_SET.md
  - Contracts:
      - Identifiers and Versions: contracts/IDENTIFIERS_AND_VERSIONS.md
      - Project Domain: contracts/PROJECT_DOMAIN.md
      - Decisions and Approvals: contracts/DECISIONS_AND_APPROVALS.md
      - Asset Domain: contracts/ASSET_DOMAIN.md
      - References and Visual Jobs: contracts/REFERENCES_AND_VISUAL_JOBS.md
      - Capture Profiles: contracts/CAPTURE_PROFILES.md
      - JSON Schema Publication: contracts/JSON_SCHEMAS.md
      - Project Filesystem: contracts/PROJECT_FILESYSTEM.md
      - Structured Repositories: contracts/STRUCTURED_REPOSITORIES.md
      - Event Log: contracts/EVENT_LOG.md
      - SQLite State Store: contracts/STATE_STORE.md
      - Migrations: contracts/MIGRATIONS.md
      - Dependency Graph: contracts/DEPENDENCY_GRAPH.md
      - Interview Questions: contracts/INTERVIEW_QUESTIONS.md
      - Document Templates: contracts/DOCUMENT_TEMPLATES.md
      - ATLAS Contract: contracts/ATLAS.md
      - Command-Line Interface: contracts/CLI.md
  - Commands:
      - Interview CLI: commands/INTERVIEW.md
      - ATLAS CLI: commands/ATLAS.md
  - Implementation:
      - Plan to 1.0: plans/IMPLEMENTATION_PLAN.md
  - Quality:
      - Engineering Baseline: quality/ENGINEERING_QUALITY.md
  - Governance:
      - RFC Template: governance/RFC_TEMPLATE.md
      - ADR 0001 — Identifiers and Versions: decisions/0001-typed-identifiers-and-revision-versions.md
      - ADR 0002 — Project Aggregate: decisions/0002-immutable-project-aggregate.md
      - ADR 0003 — Revision-Bound Approvals: decisions/0003-revision-bound-approvals.md
      - ADR 0004 — Asset Aggregate: decisions/0004-decomposed-asset-aggregate.md
      - ADR 0005 — Visual Jobs and Receipts: decisions/0005-immutable-visual-jobs-and-receipts.md
      - ADR 0006 — Capture Profile Inheritance: decisions/0006-exact-versioned-capture-profile-inheritance.md
      - ADR 0007 — Generated JSON Schemas: decisions/0007-generated-versioned-json-schemas.md
      - ADR 0008 — Safe Project Filesystem: decisions/0008-safe-project-filesystem-boundary.md
      - ADR 0009 — Structured Repositories: decisions/0009-canonical-structured-document-repositories.md
      - ADR 0010 — Hash-Chained Event Log: decisions/0010-hash-chained-append-only-event-log.md
      - ADR 0011 — Rebuildable SQLite State Index: decisions/0011-rebuildable-sqlite-state-index.md
      - ADR 0012 — Explicit Backed-Up Migrations: decisions/0012-explicit-backed-up-schema-migrations.md
      - ADR 0013 — Dependency Invalidation Graph: decisions/0013-versioned-acyclic-dependency-invalidation-graph.md
      - ADR 0014 — Stable Dual-Surface CLI: decisions/0014-stable-dual-surface-cli-contract.md
      - ADR 0015 — Guided Interview Question Model: decisions/0015-guided-interview-question-model.md
      - ADR 0016 — Resumable Interview CLI: decisions/0016-resumable-interview-cli.md
      - ADR 0017 — Document Template Engine: decisions/0017-deterministic-document-template-engine.md
      - ADR 0018 — Deterministic ATLAS: decisions/0018-deterministic-atlas-index-and-integrity.md
      - ADR Template: decisions/0000-template.md
  - Operations:
      - Documentation Site: operations/DOCUMENTATION_SITE.md

theme:
  name: material
  language: en
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light theme

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
