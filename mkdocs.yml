site_name: LudoWright
site_description: A Codex-native framework for structured game production.
site_url: https://raillen.github.io/ludowright/
repo_url: https://github.com/raillen/ludowright
repo_name: raillen/ludowright
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

nav:
  - Home: index.md
  - Documentation Atlas: ATLAS.md
  - Product:
      - Product Vision: product/PRODUCT_VISION.md
      - Roadmap: product/ROADMAP.md
  - Architecture:
      - System Overview: architecture/SYSTEM_OVERVIEW.md
  - Contracts:
      - Identifiers and Versions: contracts/IDENTIFIERS_AND_VERSIONS.md
  - Implementation:
      - Plan to 1.0: plans/IMPLEMENTATION_PLAN.md
  - Quality:
      - Engineering Baseline: quality/ENGINEERING_QUALITY.md
  - Governance:
      - RFC Template: governance/RFC_TEMPLATE.md
      - ADR 0001 — Identifiers and Versions: decisions/0001-typed-identifiers-and-revision-versions.md
      - ADR Template: decisions/0000-template.md
  - Operations:
      - Documentation Site: operations/DOCUMENTATION_SITE.md

theme:
  name: material
  language: en
  features:
    - content.action.edit
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light theme

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
